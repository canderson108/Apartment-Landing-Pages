<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Utilities | Summit Communities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --summit-navy: #1a2a44;
            --summit-gold: #c5a059;
            --summit-bg: #f8f9fa;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--summit-bg);
            color: #1a1a1a;
        }
        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }
        .summit-button {
            background-color: var(--summit-navy);
            color: white;
            transition: all 0.3s ease;
        }
        .summit-button:hover {
            background-color: #0f1a2e;
        }
        .gold-accent {
            color: var(--summit-gold);
        }
        .bg-summit-navy { background-color: var(--summit-navy); }
        .border-summit-gold { border-color: var(--summit-gold); }
    </style>
